services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: rax-n8n:latest
    container_name: rax-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-${N8N_WEBHOOK_BASE_URL:-http://localhost:5678/}}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - RAX_API_URL=${NEXT_PUBLIC_APP_URL:-https://rax-red.vercel.app}
      - RAX_N8N_SHARED_SECRET=${RAX_N8N_SHARED_SECRET:-${SUPABASE_SERVICE_ROLE_KEY}}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://rax-red.vercel.app}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows/n8n:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rax-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rax-cloudflared
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      - n8n
    networks:
      - rax-network

networks:
  rax-network:
    driver: bridge

volumes:
  n8n_data:
